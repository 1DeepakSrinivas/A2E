name: CI
on:
  push:
  pull_request:
env:
  RUST_VERSION: 1.96.0
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the pinned Results revision
        id: results
        env:
          RESULTS_TOKEN: ${{ secrets.A2E_RESULTS_CHECKOUT_TOKEN }}
        run: |
          if [[ -n "$RESULTS_TOKEN" ]]; then
            echo "revision=$(git rev-parse HEAD:a2e-results)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set A2E_RESULTS_CHECKOUT_TOKEN to run the Results schema contract test in CI."
          fi
      - uses: actions/checkout@v4
        if: steps.results.outputs.revision != ''
        with:
          repository: 1DeepakSrinivas/A2E-Results
          ref: ${{ steps.results.outputs.revision }}
          path: a2e-results
          token: ${{ secrets.A2E_RESULTS_CHECKOUT_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release --locked
      - run: target/release/a2e tools validate
      - run: target/release/a2e cases validate
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh
      - run: shellcheck --severity=warning setup.sh
  pi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: "cargo miri test --lib --locked -- --skip measure::"
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
