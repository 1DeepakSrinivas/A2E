id = "chain-complete-rent"
category = "chain"
tags = ["tier2", "store", "data"]
split = "heldout"
golden_answer = "The rent todo is done."

[scope]
prompt = "Mark the rent todo as done."
expected_calls = 2

[tools]
allowed = ["todo_list", "todo_complete"]

[[fixtures.todos]]
title = "Water plants"

[[fixtures.todos]]
title = "Pay rent"

[[fixtures.todos]]
title = "Book flights"

[[stage]]
instruction = "List the open todos."
tools = ["todo_list"]

[[stage]]
instruction = "Complete the rent todo."
tools = ["todo_complete"]

[[check]]
kind = "state"
path = "/todos/1/done"
eq = true

[[check]]
kind = "state"
path = "/todos/0/done"
eq = false

[[golden]]
tool = "todo_list"
args = { "status" = "open" }

[[golden]]
tool = "todo_complete"
args = { "id" = 2 }
