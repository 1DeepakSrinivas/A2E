id = "chain-miles-to-km"
category = "chain"
tags = ["tier2", "units", "files"]
split = "heldout"
golden_answer = "It is 19.312128 km."

[scope]
prompt = "dist.txt holds a distance in miles. Convert it to kilometres and save only the number to km.txt."
expected_calls = 3

[tools]
allowed = ["read_file", "unit_convert", "write_file"]

[fixtures.files]
"dist.txt" = "12"

[[stage]]
instruction = "Read dist.txt."
tools = ["read_file"]

[[stage]]
instruction = "Convert miles to kilometres."
tools = ["unit_convert"]

[[stage]]
instruction = "Write the number to km.txt."
tools = ["write_file"]

[[check]]
kind = "file"
path = "km.txt"
regex = "^\\s*19\\.31"

[output]
files = ["km.txt"]

[[golden]]
tool = "read_file"
args = { "path" = "dist.txt" }

[[golden]]
tool = "unit_convert"
args = { "value" = 12, "from" = "mi", "to" = "km" }

[[golden]]
tool = "write_file"
args = { "path" = "km.txt", "content" = "19.312128" }
