id = "chain-ticket-id"
category = "chain"
tags = ["tier2", "text", "files", "compute"]
split = "dev"
golden_answer = "The ticket is INC-4821."

[scope]
prompt = "Read ticket.txt, extract the ticket ID (it looks like INC-1234), and write it to ticket_id.txt."
expected_calls = 3

[tools]
allowed = ["read_file", "regex_extract", "write_file"]

[fixtures.files]
"ticket.txt" = "Ticket INC-4821 opened by Sam"

[[stage]]
instruction = "Read ticket.txt."
tools = ["read_file"]

[[stage]]
instruction = "Extract the ID."
tools = ["regex_extract"]

[[stage]]
instruction = "Write the ID to ticket_id.txt."
tools = ["write_file"]

[[check]]
kind = "file"
path = "ticket_id.txt"
contains = "INC-4821"

[output]
files = ["ticket_id.txt"]

[[golden]]
tool = "read_file"
args = { "path" = "ticket.txt" }

[[golden]]
tool = "regex_extract"
args = { "text" = "Ticket INC-4821 opened by Sam", "pattern" = "INC-\\d+" }

[[golden]]
tool = "write_file"
args = { "path" = "ticket_id.txt", "content" = "INC-4821" }
