id = "multiple-db-count"
category = "multiple"
tags = ["tier2", "db"]
split = "heldout"
golden_answer = "There are 4 supplies products."

[scope]
prompt = "How many products are in the supplies category?"
expected_calls = 1

[tools]
allowed = ["db_schema", "db_lookup", "db_query"]
distractors = 2

[fixtures.db]
sql_file = "../../fixtures/inventory.sql"

[[check]]
kind = "answer"
number = { "value" = 4 }

[[check]]
kind = "calls_at_most"
max = 3

[[golden]]
tool = "db_query"
args = { "sql" = "SELECT count(*) FROM products WHERE category = 'supplies'" }
