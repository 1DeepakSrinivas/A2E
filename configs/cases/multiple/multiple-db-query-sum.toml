id = "multiple-db-query-sum"
category = "multiple"
tags = ["tier2", "db", "data"]
split = "dev"
golden_answer = "The total stock is 11."

[scope]
prompt = "What is the total stock of all products in the tools category?"
expected_calls = 1

[tools]
allowed = ["db_schema", "db_lookup", "db_query"]

[fixtures.db]
sql_file = "../../fixtures/inventory.sql"

[[check]]
kind = "call"
tool = "db_query"

[[check]]
kind = "answer"
number = { "value" = 11 }

[[golden]]
tool = "db_query"
args = { "sql" = "SELECT sum(stock) FROM products WHERE category = 'tools'" }
