id = "multiple-read-vs-search"
category = "multiple"
tags = ["tier2", "smoke", "fs"]
split = "dev"
golden_answer = "The report says 42 units were sold."

[scope]
prompt = "Show me the contents of report.txt."
expected_calls = 1

[tools]
allowed = ["search_files", "read_file", "list_dir"]

[fixtures.files]
"report.txt" = "Sales: 42 units sold."
"other.txt" = "unrelated"

[[check]]
kind = "call"
tool = "read_file"
args = { "path" = "report.txt" }
match = "subset"

[[check]]
kind = "answer"
contains = "42 units"

[[golden]]
tool = "read_file"
args = { "path" = "report.txt" }
