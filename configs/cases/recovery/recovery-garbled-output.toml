id = "recovery-garbled-output"
category = "recovery"
tags = ["faults", "fs"]
split = "heldout"
golden_answer = "The price is 12."

[scope]
prompt = "Read price.txt and tell me the number in it. If the output looks garbled, read the file again."
expected_calls = 2

[tools]
allowed = ["read_file"]

[fixtures.files]
"price.txt" = "Price: 12"

[[fixtures.faults]]
tool = "read_file"
mode = "malformed"
n = 1

[[stage]]
instruction = "Read price.txt."
tools = ["read_file"]

[[check]]
kind = "answer"
number = { "value" = 12 }

[[golden]]
tool = "read_file"
args = { "path" = "price.txt" }

[[golden]]
tool = "read_file"
args = { "path" = "price.txt" }
