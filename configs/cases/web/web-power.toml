id = "web-power"
category = "web"
tags = []
split = "heldout"
golden_answer = "It needs 5V 2.5A (source pi_power)."

[scope]
prompt = "Search the web for the power supply that the Raspberry Pi 3 Model B+ needs and report it with its source."
expected_calls = 2

[tools]
allowed = ["web_search", "fetch_page"]

[[fixtures.pages]]
id = "pi_specs"
url = "https://www.raspberrypi.com/products/raspberry-pi-3-model-b-plus/"
title = "Raspberry Pi 3 Model B+ specifications"
text = "The Raspberry Pi 3 Model B+ has 1 GB of LPDDR2 SDRAM and a 1.4 GHz 64-bit quad-core processor."

[[fixtures.pages]]
id = "pi_power"
url = "https://www.raspberrypi.com/documentation/power/"
title = "Raspberry Pi 3 Model B+ power supply"
text = "The Raspberry Pi 3 Model B+ needs a 5V 2.5A micro USB power supply."

[[fixtures.pages]]
id = "garden"
url = "https://example.org/gardening"
title = "Garden notes"
text = "Plant seedlings after the last frost."

[[stage]]
instruction = "Search for the power supply."
tools = ["web_search"]

[[stage]]
instruction = "Retrieve the power page."
tools = ["fetch_page"]

[[check]]
kind = "fetched_source"
id = "pi_power"

[[check]]
kind = "answer"
contains = "2.5"

[[golden]]
tool = "web_search"
args = { "query" = "Raspberry Pi 3 Model B+ power supply" }

[[golden]]
tool = "fetch_page"
args = { "source_id" = "pi_power" }
