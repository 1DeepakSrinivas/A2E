# Settings for this checkout only. Copy to configs/local.toml, which Git ignores (or run `a2e config init`).
# Later layers win: models.toml, settings.toml, hosts/<user>@<host>.toml, local.toml, a suite file,
# A2E_<SECTION>_<KEY> variables, then --set. Every key is listed in docs/CONFIG.md.

[host]
# Paths are resolved from the working directory; run commands at the repository root.
models_dir = "models"

[llama]
server = "deps/llama.cpp/build-a2e/bin/llama-server"
gpu_layers = 0

[limits]
# Increase only for a separately labelled Mac resource envelope.
memory_mb = 768
