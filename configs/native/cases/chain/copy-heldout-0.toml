id = "copy-heldout-0"
category = "chain"
tags = ["migrated", "local"]
split = "heldout"

[scope]
expected_calls = 2
prompt = "Read reading.txt and copy its exact contents to copy.txt."

[tools]
allowed = ["read_file", "write_file"]

[fixtures.files]
"reading.txt" = "Reading: 30"

[[stage]]
