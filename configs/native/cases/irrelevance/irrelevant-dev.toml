id = "irrelevant-dev"
category = "irrelevance"
tags = ["migrated", "edge"]
split = "dev"

[scope]
expected_calls = 1
prompt = "No tool is needed. Reply with exactly ready."

[tools]
allowed = ["device_list", "search_files"]

[[stage]]
instruction = "Give the requested answer without tools."
successes = 1
tools = ["device_list"]

[[check]]
kind = "no_call"
tool = "device_list"

[[check]]
kind = "no_call"
tool = "search_files"

[[check]]
contains = "ready"
kind = "answer"
