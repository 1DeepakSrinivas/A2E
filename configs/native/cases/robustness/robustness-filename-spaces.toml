id = "robustness-filename-spaces"
category = "robustness"
tags = ["types", "files"]
split = "dev"
golden_answer = "It says to plant tomatoes."

[scope]
prompt = "Read the file called my notes (2).txt and tell me what it says."
expected_calls = 1

[tools]
allowed = ["read_file"]

[fixtures.files]
"my notes (2).txt" = "Plant tomatoes in May."

[[stage]]
instruction = "Read the file."
tools = ["read_file"]

[[check]]
kind = "call"
tool = "read_file"
args = { "path" = "my notes (2).txt" }
match = "subset"

[[check]]
kind = "answer"
contains = "tomatoes"

[[golden]]
tool = "read_file"
args = { "path" = "my notes (2).txt" }
