id = "mixed-dev-1"
category = "web"
tags = ["migrated", "mixed"]
split = "dev"

[scope]
expected_calls = 4
prompt = "Search for Raspberry Pi software installation instructions, retrieve the page, save a short cited summary to instructions.txt, and give the same summary as your final answer."

[tools]
allowed = ["web_search", "fetch_page", "write_file", "read_file"]

[[fixtures.pages]]
id = "pi_specs"
text = "The Raspberry Pi 3 Model B+ has 1GB LPDDR2 SDRAM and a 1.4GHz 64-bit quad-core processor. It requires a 5V/2.5A micro USB power supply."
title = "Raspberry Pi 3 Model B+ specifications"
url = "https://www.raspberrypi.com/products/raspberry-pi-3-model-b-plus/"

[[fixtures.pages]]
id = "pi_software"
text = "Raspberry Pi Imager writes Raspberry Pi OS to a microSD card. Choose the device, operating system and storage before writing the image."
title = "Raspberry Pi software installation"
url = "https://www.raspberrypi.com/software/"

[[fixtures.pages]]
id = "irrelevant"
text = "Plant seedlings after the last frost."
title = "Garden notes"
url = "https://example.org/gardening"

[judge]
enabled = true
required_facts = ["Raspberry Pi Imager writes the OS", "Select the device, operating system, and storage", "Write the image to a microSD card"]

[[stage]]
instruction = "Search for Raspberry Pi software installation."
successes = 1
tools = ["web_search"]

[[stage]]
instruction = "Retrieve the relevant page."
successes = 1
tools = ["fetch_page"]

[[stage]]
instruction = "Save a short summary with source ID and URL to instructions.txt."
successes = 1
tools = ["write_file"]

[[stage]]
instruction = "Read the saved summary and return it."
successes = 1
tools = ["read_file"]

[[check]]
kind = "fetched_url"
url = "https://www.raspberrypi.com/software/"

[[check]]
contains = "Raspberry Pi"
kind = "file"
path = "instructions.txt"
