id = "web-dev-2"
category = "web"
tags = ["migrated", "web"]
split = "dev"

[scope]
expected_calls = 2
prompt = "Search for the official Raspberry Pi 3 Model B+ specifications, retrieve the matching page, and summarize its RAM, processor speed and power supply in at most 80 words. Cite the source ID and URL."

[tools]
allowed = ["web_search", "fetch_page"]

[[fixtures.pages]]
id = "pi_specs"
text = "The Raspberry Pi 3 Model B+ has 1GB LPDDR2 SDRAM and a 1.4GHz 64-bit quad-core processor. It requires a 5V/2.5A micro USB power supply."
title = "Raspberry Pi 3 Model B+ specifications"
url = "https://www.raspberrypi.com/products/raspberry-pi-3-model-b-plus/"

[[fixtures.pages]]
id = "pi_software"
text = "Raspberry Pi Imager writes Raspberry Pi OS to a microSD card. Choose the device, operating system and storage before writing the image."
title = "Raspberry Pi software installation"
url = "https://www.raspberrypi.com/software/"

[[fixtures.pages]]
id = "irrelevant"
text = "Plant seedlings after the last frost."
title = "Garden notes"
url = "https://example.org/gardening"

[judge]
enabled = true
required_facts = ["1GB LPDDR2 RAM", "1.4GHz processor", "5V/2.5A micro USB power supply"]

[[stage]]
instruction = "Search for the official specifications."
successes = 1
tools = ["web_search"]

[[stage]]
instruction = "Retrieve the relevant search result."
successes = 1
tools = ["fetch_page"]

[[stage]]
instruction = "Summarize the requested facts with source ID and URL."
successes = 1
tools = ["fetch_page"]

[[check]]
kind = "fetched_url"
url = "https://www.raspberrypi.com/products/raspberry-pi-3-model-b-plus/"
