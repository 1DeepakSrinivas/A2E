id = "live-llama-cpp"
category = "web"
tags = ["live"]
split = "heldout"
golden_answer = "Summary."

[scope]
prompt = "Search the web for what llama.cpp is and give a short cited summary."
expected_calls = 2

[tools]
allowed = ["web_search", "fetch_page"]

[[stage]]
instruction = "Search the web."
tools = ["web_search"]

[[stage]]
instruction = "Retrieve one result."
tools = ["fetch_page"]

[[check]]
kind = "fetched_count"
min = 1

[[check]]
kind = "answer"
regex = "."

[judge]
enabled = true
required_facts = ["llama.cpp runs language models locally", "It is written in C and C++"]

[[golden]]
tool = "web_search"
args = { "query" = "x" }

[[golden]]
tool = "fetch_page"
args = { "source_id" = "x" }
