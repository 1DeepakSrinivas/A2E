id = "live-pi-ram"
category = "web"
tags = ["live"]
split = "heldout"
golden_answer = "Summary."

[scope]
prompt = "Search the web for the RAM size of the Raspberry Pi 3 Model B+, retrieve one result, and answer with the amount."
expected_calls = 2

[tools]
allowed = ["web_search", "fetch_page"]

[[stage]]
instruction = "Search the web."
tools = ["web_search"]

[[stage]]
instruction = "Retrieve one result."
tools = ["fetch_page"]

[[check]]
kind = "fetched_count"
min = 1

[[check]]
kind = "answer"
regex = "(?i)1\\s?gb"

[[golden]]
tool = "web_search"
args = { "query" = "x" }

[[golden]]
tool = "fetch_page"
args = { "source_id" = "x" }
