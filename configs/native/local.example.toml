[runtime]
# Paths are resolved from the working directory; run commands at the repository root.
llama_server = "deps/llama.cpp/build-a2e/bin/llama-server"
models_dir = "models/native"
# Increase only for a separately labelled Mac resource envelope.
memory_limit_mb = 768
gpu_layers = 0

[judge]
# Set explicit OpenRouter IDs. No default or fallback model is selected.
model = ""
provider = ""
max_requests = 100

[roles]
controller = false
benchmark_target = false
