protocol = 1
executable = "target/debug/examples/rust_tool"
args = []
timeout_seconds = 5
output_limit_bytes = 8192

[[tools]]
name = "uppercase"
description = "Convert text to uppercase."
parameters = { type = "object", properties = { text = { type = "string", description = "Text to convert", maxLength = 1024 } }, required = ["text"], additionalProperties = false }
