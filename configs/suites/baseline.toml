# Baseline (study design A): standard prompt set, 1 warm-up + 3 measured runs, plain generation and tool calling
# side by side for every model and quantization.
[suite]
name = "baseline"
description = "Both models x their higher-quality and IQ3_M quants: plain generation vs custom chains vs BFCL single-turn."
seed = 0

[repeats]
warmup = 1
measured = 3

[server]
ctx = 8192

[run]
idle_seconds = 30
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b-instruct-2507", "granite-3-1-2b-instruct"]
quant = ["q5_k_m", "q6_k", "iq3_m"]
kv_quant = ["f16"]

[axes]
grammar = [false]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024]

[[tasks]]
kind = "plain"
n = 6
decode_len = [128, 512]

[[tasks]]
kind = "custom"
family = ["calc", "retrieval"]
depth = 3
n = 5

[[tasks]]
kind = "bfcl"
category = ["simple_python", "multiple"]
n = 20
