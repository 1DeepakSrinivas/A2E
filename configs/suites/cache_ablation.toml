# Prefix caching and KV-cache quantization over multi-turn agent sessions (key question 3).
[suite]
name = "cache_ablation"
description = "Depth-5 chains and BFCL multi-turn with prefix cache on/off and KV cache f16/q8_0."
seed = 0

[repeats]
warmup = 1
measured = 3

[server]
ctx = 16384

[run]
idle_seconds = 30
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b", "xlam2-3b", "phi4-mini"]
quant = ["q4_0"]
kv_quant = ["f16", "q8_0"]

[axes]
grammar = [true]
prefix_cache = [true, false]
decode_len = [256]
schema_len = [1024, 2048]

[[tasks]]
kind = "custom"
family = ["retrieval", "notes"]
depth = 5
n = 5

[[tasks]]
kind = "bfcl"
category = ["multi_turn_base"]
n = 5
decode_len = [512]
