# Agent loop length and argument count (custom task suite of the proposal): chains of 2 to 5 tool calls, and
# notes with 1, 3 or 5 arguments per call, at a fixed schema length.
[suite]
name = "chains"
description = "Chain depth 2 to 5 for every family, notes with 1/3/5 arguments, grammar off/on."
seed = 0

[repeats]
warmup = 1
measured = 3

[server]
ctx = 8192

[run]
idle_seconds = 30
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b-instruct-2507", "granite-3-1-2b-instruct"]
quant = ["q5_k_m", "q6_k", "iq3_m"]
kv_quant = ["f16"]

[axes]
grammar = [false, true]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024]

[[tasks]]
kind = "custom"
family = ["calc", "retrieval"]
depth = [2, 3, 4, 5]
n = 5

[[tasks]]
kind = "custom"
family = "notes"
depth = [2, 3, 4, 5]
n_args = [1, 3, 5]
n = 5
