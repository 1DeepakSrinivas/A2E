# One broad report: 50 tasks per model, quant and grammar setting, from single BFCL calls to multi-step agent chains.
# Edit the two lines marked EDIT to the models and quants you have on this machine, then run:
#   scripts/run_suite.sh full_eval
#   scripts/report_full_eval.sh <experiment id>
# One measured run and no warm-up, so there is no repeat-to-repeat spread. Read results by category and family
# totals, not by single cells (a cell is 2 to 4 tasks). The `web` family is left out because live results change.
# Thinking is switched off for every model (see [server] thinking below): Qwen3 otherwise spends the whole 256-token
# budget on a thinking block, the reply is cut off, and the tool call is lost.
[suite]
name = "full_eval"
description = "50 tasks per model, quant and grammar setting: BFCL single and multi-turn plus custom chains of 2 to 5 calls."
seed = 0

[repeats]
warmup = 0
measured = 1

[server]
ctx = 16384  # BFCL multi-turn needs 16384 or more
thinking = "off"  # llama-server --chat-template-kwargs {"enable_thinking": false}; templates without it are unaffected

[run]
idle_seconds = 20
cooldown_c = 0  # on the Pi use 55
cooldown_timeout_s = 900

[matrix]
device = ["mac", "pi5"]  # a machine runs only its own device's jobs
model = ["qwen3-4b", "gemma3-4b"]  # EDIT: the two models (names from configs/models.toml)
quant = ["q4_0", "q8_0"]  # EDIT: the two quants
kv_quant = ["f16"]

[axes]
grammar = [false, true]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024]

# ---- BFCL single turn: 15 tasks ------------------------------------------------------------------------------------
[[tasks]]
kind = "bfcl"
category = "simple_python"  # one correct call
n = 4

[[tasks]]
kind = "bfcl"
category = "multiple"  # choose among several tools
n = 3

[[tasks]]
kind = "bfcl"
category = "parallel"  # several calls in one reply
n = 3

[[tasks]]
kind = "bfcl"
category = "parallel_multiple"  # choose and call several
n = 2

[[tasks]]
kind = "bfcl"
category = "irrelevance"  # correctly decline
n = 3

# ---- BFCL multi turn: 9 tasks, state carried across user turns ----------------------------------------------------
[[tasks]]
kind = "bfcl"
category = "multi_turn_base"
n = 4

[[tasks]]
kind = "bfcl"
category = "multi_turn_miss_func"  # a needed tool is revealed later
n = 2

[[tasks]]
kind = "bfcl"
category = "multi_turn_miss_param"  # a required argument is missing
n = 3

# ---- custom agent chains: 26 tasks, 2 to 5 tool calls each -------------------------------------------------------
[[tasks]]
kind = "custom"
family = "calc"  # arithmetic chains
depth = [2, 4]
n = 2

[[tasks]]
kind = "custom"
family = "notes"  # write notes, read them back
depth = 3
n = 2

[[tasks]]
kind = "custom"
family = ["retrieval", "fs_search"]  # search and read, then answer
depth = [2, 4]
n = 2

[[tasks]]
kind = "custom"
family = ["fs_organize", "math", "fs_math"]  # file changes checked by final state, math, file plus math
depth = [3, 5]
n = 2
