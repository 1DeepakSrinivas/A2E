# Does the harness change success per joule? Each [[harness]] entry changes one thing around the model, so the
# effect of each lever is measured against "baseline" on the same tasks. The last two combine levers.
# Analysis: `a2e results efficiency harness`. Rules and margin: docs/PREREGISTRATION.md.
[suite]
name = "harness_ablation"
description = "Prompt format, context management, error recovery and stopping rules against the baseline harness."
seed = 0

[repeats]
warmup = 1
measured = 3

[server]
ctx = 16384

[run]
idle_seconds = 30
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b", "xlam2-3b"]
quant = ["q4_0"]
kv_quant = ["f16"]

[axes]
grammar = [false]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024]

[[harness]]
name = "baseline"

[[harness]]
name = "compact"
prompt_format = "compact"

[[harness]]
name = "natural"
prompt_format = "natural"

[[harness]]
name = "mask"
context = "mask"

[[harness]]
name = "truncate"
context = "truncate"

[[harness]]
name = "feedback"
recovery = "feedback"

[[harness]]
name = "retry"
recovery = "retry"

[[harness]]
name = "tight"
stopping = "tight"

[[harness]]
name = "early_stop"
stopping = "early_stop"

[[harness]]
name = "lean"
prompt_format = "compact"
context = "mask"
recovery = "feedback"
stopping = "early_stop"

[[harness]]
name = "heavy"
prompt_format = "natural"
recovery = "retry"

[[tasks]]
kind = "custom"
family = ["fs_search", "fs_organize", "math", "fs_math"]
depth = [3, 4]
n = 5

[[tasks]]
kind = "bfcl"
category = ["simple_python", "multiple", "parallel", "irrelevance", "multi_turn_base"]
n = 10
