# Bottleneck analysis (study design C): prefill vs decode microbenchmarks with llama-bench, and on the Pi the top
# kernels from Linux perf. Prompt sizes follow the schema lengths of the factorial suite. llama-bench repeats each
# test `reps` times itself, so one measured run per job is enough. perf needs root or kernel.perf_event_paranoid <= 1.
[suite]
name = "kernels"
description = "llama-bench pp 256/1024/2048 and tg 128/512 for every model, quant and KV cache; perf top kernels on the Pi."
seed = 0

[repeats]
warmup = 0
measured = 1

[run]
idle_seconds = 0
sample_hz = 2
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b-instruct-2507", "granite-3-1-2b-instruct"]
quant = ["q5_k_m", "q6_k", "iq3_m"]
kv_quant = ["f16", "q8_0"]

[[tasks]]
kind = "bench"
n_prompt = [256, 1024, 2048]
n_gen = [128, 512]
perf = true
reps = 5
