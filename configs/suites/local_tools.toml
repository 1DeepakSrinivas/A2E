# On-device tool use with BFCL's simulated file system and math tools, on small BFCL starting states
# cherry-picked for small models (src/a2e/data/fs_scenarios.json). Distractor tools are real BFCL functions.
[suite]
name = "local_tools"
description = "File search, file organizing, math and file+math chains (depth 2 to 5) on curated BFCL file systems."
seed = 0

[repeats]
warmup = 1
measured = 3

[server]
ctx = 8192

[run]
idle_seconds = 30
cooldown_c = 55
cooldown_timeout_s = 900

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b-instruct-2507", "granite-3-1-2b-instruct"]
quant = ["q5_k_m", "q6_k", "iq3_m"]
kv_quant = ["f16"]

[axes]
grammar = [false, true]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024, 2048]

[[tasks]]
kind = "custom"
family = ["fs_search", "fs_organize", "math"]
depth = [2, 3, 4, 5]
n = 5

[[tasks]]
kind = "custom"
family = "fs_math"
depth = [3, 4, 5]
n = 5
