# Quick end-to-end check of a new machine or model. A few minutes. Not used for analysis.
[suite]
name = "smoke"
description = "One small job of each kind on Qwen3-4B Q4_0, one measured run, no warm-up."
seed = 0

[repeats]
warmup = 0
measured = 1

[server]
ctx = 8192

[run]
idle_seconds = 5
cooldown_c = 0

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b"]
quant = ["q4_0"]
kv_quant = ["f16"]

[axes]
grammar = [true]
prefix_cache = [true]
decode_len = [128]
schema_len = [512]

[[tasks]]
kind = "plain"
n = 2

[[tasks]]
kind = "custom"
family = "calc"
depth = 2
n = 2

[[tasks]]
kind = "bfcl"
category = ["simple_python", "irrelevance"]
n = 3
