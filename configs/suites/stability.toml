# Stability (study design D): long back-to-back agent sessions with no cooldown, to find thermal throttling knee
# points, under different CPU governors on the Pi. Governor jobs need root on the Pi; on the Mac they are skipped
# and only the unchanged-governor jobs run.
[suite]
name = "stability"
description = "40 depth-5 retrieval chains per run, no cooldown, governor ondemand vs performance (Pi)."
seed = 0

[repeats]
warmup = 0
measured = 3

[server]
ctx = 8192

[run]
idle_seconds = 30
sample_hz = 1
cooldown_c = 0

[matrix]
device = ["pi5", "mac"]
model = ["qwen3-4b", "gemma3-4b"]
quant = ["q4_0"]
kv_quant = ["f16"]

[axes]
grammar = [true]
prefix_cache = [true]
decode_len = [256]
schema_len = [1024]
governor = [""]

[[tasks]]
kind = "custom"
family = "retrieval"
depth = 5
n = 40

[[tasks]]
kind = "custom"
family = "retrieval"
depth = 5
n = 40
governor = ["ondemand", "performance"]
