# Test groups. `a2e test <group>` (or scripts/run_tests.sh <group>) runs exactly what is listed here,
# so a group means the same thing in every session. Extra arguments are passed to pytest.

[groups.quick]
description = "Unit and integration tests. No hardware. About a minute. Run this constantly."
markers = "unit or integration"

[groups.unit]
description = "Pure logic: parsers, configs, scoring, store, energy maths."
markers = "unit"

[groups.integration]
description = "Real processes and HTTP against the fake llama-server; the runner end to end; results."
markers = "integration"

[groups.sweep]
description = "Large sweeps: BFCL ground truth through the official checker, every custom chain, the full grid."
markers = "sweep"

[groups.bfcl]
description = "Everything about the BFCL integration (vendored checker, conversion, runners)."
keyword = "bfcl"

[groups.runner]
description = "Suite configs, the runner, the store and the results layer."
paths = ["tests/unit/test_suite.py", "tests/unit/test_store_v2.py", "tests/integration/test_runner.py",
         "tests/integration/test_results.py"]

[groups.hardware]
description = "Real device and real llama-server. Self-skips unless the variables below are set."
markers = "hardware"
env = ["A2E_LLAMA_SERVER", "A2E_GGUF"]

[groups.all]
description = "Everything. Hardware tests skip themselves when not applicable."
markers = ""
