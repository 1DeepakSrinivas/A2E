[project]
name = "a2e"
version = "0.1.0"
description = "Profiling tool-calling (agentic) workloads for small LLMs on edge hardware"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "psutil>=5.9",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "jsonschema>=4.26.0",
]

[project.scripts]
a2e = "a2e.cli:app"

[project.optional-dependencies]
bfcl = [
    "mpmath>=1.4.1",
]
tui = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure logic, no processes",
    "integration: fake llama-server over HTTP, sampler, store",
    "sweep: factorial grid and baseline protocol",
    "slow: takes more than a few seconds",
    "hardware: needs a real device and/or llama-server (self-skips otherwise)",
]
